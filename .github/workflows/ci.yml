name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  quick:
    name: Fast checks (no toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check wrapper entries
        run: |
          node --check src/openscad.mjs
          node --input-type=module --check src/openscad.mjs
          node --check test/smoke.test.mjs
      - name: Syntax-check shell scripts
        run: |
          bash -n scripts/build-deps.sh
          bash -n scripts/build-wasm.sh
          bash -n scripts/stage-dist.sh
      - name: Patches still apply to the pinned submodule
        run: |
          cd openscad
          git apply --check ../third-party/patches/openscad-emsdk-sysroot.patch
          git apply --check ../third-party/patches/openscad-wasm-memfs.patch

  build:
    name: Full Emscripten build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EMSDK: ${{ github.workspace }}/emsdk-6.0.5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint bison build-essential ccache flex \
            gettext git gperf libtool ninja-build pkg-config python3-pip \
            texinfo unzip wget
          pip install --user --break-system-packages meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Emscripten 6.0.5
        run: |
          git clone --depth 1 --branch 6.0.5 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install 6.0.5
          "$EMSDK/emsdk" activate 6.0.5
      - name: Build dependencies
        run: |
          source "$EMSDK/emsdk_env.sh"
          scripts/build-deps.sh
      - name: Build OpenSCAD WASM
        run: |
          source "$EMSDK/emsdk_env.sh"
          scripts/build-wasm.sh
      - name: Stage dist and smoke-test
        run: |
          scripts/stage-dist.sh
          ls -la dist/
          npm test
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: openscad-wasm-dist
          path: dist/

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quick, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: openscad-wasm-dist
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
